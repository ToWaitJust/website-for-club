<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI+社团 · 福州大学</title>
<meta name="description" content="AI+社团门户 - AI+IT / AI+业务 / AI+嵌入式 三条业务线信息展示、报名与反馈入口">
<link rel="stylesheet" href="/assets/css/main.css">
<style>
  .page-main { padding: 1rem 0 0; }
  .section { margin-bottom: 3rem; }
  .notices-wrap { max-width: 860px; margin: 0 auto; }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a class="brand" href="/"><span class="logo">AI</span><span class="name">AI+社团</span></a>
    <ul class="nav-links"></ul>
  </div>
</nav>

<main class="page-main">
  <section class="hero">
    <div class="logo-badge">♾</div>
    <h1>AI+社团</h1>
    <p>AI+IT · AI+业务 · AI+嵌入式</p>
  </section>

  <section class="section container">
    <h2 class="section-title">三条业务线</h2>
    <div class="biz-cards" id="bizCards">
      <p class="empty" style="color:var(--muted)">加载中…</p>
    </div>
  </section>

  <section class="section container">
    <h2 class="section-title">最新公告</h2>
    <div class="notices-wrap">
      <div class="notices" id="noticeBox">
        <p class="empty">加载中…</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div>福州大学 · AI+社团</div>
    <div class="contact">QQ 群 / 微信 / 邮箱 见运营后台公告</div>
  </div>
</footer>

<script src="/assets/js/app.js"></script>
<script>
  // 首页卡片由 site.json 数据驱动:新增业务线只改 content/site.json,无需改本页
  (async function initHome() {
    const data = await App.init({ notices: '#noticeBox' });
    const cards = document.getElementById('bizCards');
    const lines = data.businessLines || [];
    if (!lines.length) {
      cards.innerHTML = '<p class="empty" style="color:var(--muted)">暂无业务线数据</p>';
      return;
    }
    cards.innerHTML = lines.map((b) => `
      <a class="biz-card" href="${b.path}" style="--card-accent:${b.accent}">
        <span class="register-badge ${b.registerOpen ? '' : 'closed'}">${b.registerOpen ? '报名中' : '待开放'}</span>
        <div class="icon">${b.icon}</div>
        <h3>${b.name}</h3>
        <div class="tagline">${b.tagline}</div>
        <div class="desc">${b.desc}</div>
        <div class="features">${(b.features || []).map((f) => `<span>${f}</span>`).join('')}</div>
        <div class="go">进入业务线 →</div>
      </a>
    `).join('');
  })();
</script>
</body>
</html>
